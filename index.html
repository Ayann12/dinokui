<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dino Runner</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="day">

    <div class="game-container">

        <!-- =========================
             TOP BAR
        ========================== -->

        <div class="top-bar">

            <div class="title">
                DINO RUNNER
            </div>

            <div class="score-container">

                <span>SCORE</span>
                <strong id="score">00000</strong>

                <span>HI</span>
                <strong id="best-score">00000</strong>

            </div>

        </div>


        <!-- =========================
             GAME
        ========================== -->

        <div id="game">

            <!-- START SCREEN -->

            <div id="start-screen">

                <div class="start-title">
                    DINO RUNNER
                </div>

                <div class="start-subtitle">
                    Tekan SPACE untuk mulai
                </div>

                <button id="start-button">
                    MULAI
                </button>

            </div>


            <!-- GAME OVER SCREEN -->

            <div id="game-over-screen" class="hidden">

                <div class="game-over-title">
                    GAME OVER
                </div>

                <div class="final-score">
                    SCORE:
                    <strong id="final-score">0</strong>
                </div>

                <div class="final-score">
                    BEST:
                    <strong id="final-best-score">0</strong>
                </div>

                <button id="restart-button">
                    MAIN LAGI
                </button>

            </div>


            <!-- =========================
                 CLOUD
            ========================== -->

            <div class="cloud cloud-1"></div>
            <div class="cloud cloud-2"></div>


            <!-- =========================
                 DINO
            ========================== -->

            <img id="dino" src="img/dino.png" alt="Dino">


            <!-- =========================
                 CACTUS
            ========================== -->

            <div id="cactus">

                <div class="cactus-main"></div>

                <div class="cactus-left"></div>

                <div class="cactus-right"></div>

            </div>


            <!-- =========================
                 GROUND
            ========================== -->

            <div id="ground">

                <div class="ground-line"></div>

            </div>

        </div>


        <!-- =========================
             CONTROLS
        ========================== -->

        <div class="controls">

            <span>SPACE</span>
            Lompat

            <span>↑</span>
            Lompat

            <span>R</span>
            Restart

        </div>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
